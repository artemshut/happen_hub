# fly.toml app configuration file generated for happen-hub on 2025-02-22T10:59:19+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'happen-hub'
primary_region = 'arn'
console_command = '/rails/bin/rails console'

[env]
  PORT = "8080"
  RAILS_MAX_THREADS = "3"
  SOLID_QUEUE_THREADS = "3"

[build]

[processes]
  app = "bundle exec puma -C config/puma.rb"
  worker = "bin/jobs start --threads 3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
